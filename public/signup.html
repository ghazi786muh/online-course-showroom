<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CourseHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> CourseHub</a>
      <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="login.html" class="nav-btn login-btn">Login</a></li>
        <li><a href="signup.html" class="nav-btn signup-btn">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
      <div id="alert-box" class="alert"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password (Min 8 characters)</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <div class="phone-group">
            <select id="countryCode" class="form-control">
              <option value="+92">+92 PK</option>
              <option value="+91">+91 IN</option>
              <option value="+1">+1 US</option>
              <option value="+44">+44 UK</option>
            </select>
            <input type="tel" id="phone" class="form-control" required placeholder="3001234567">
          </div>
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
