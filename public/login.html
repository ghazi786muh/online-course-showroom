<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CourseHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> CourseHub</a>
      <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="login.html" class="nav-btn login-btn">Login</a></li>
        <li><a href="signup.html" class="nav-btn signup-btn">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome Back</h2>
      <div id="alert-box" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Login</button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
